name: Sett AI
description: 'Sett AI is a creative performance AI platform for mobile game user acquisition (UA), offering
  "agentic AI" that helps game studios and performance-marketing teams research, generate, analyze, and
  deploy video and playable ad creatives at scale to combat creative fatigue. Sett agents connect to ad
  networks (Meta, Google, AppLovin, Unity, Mintegral) and MMP data to ideate concepts, generate playables
  and videos, and analyze creative performance. Backed by Bessemer Venture Partners; the company raised a
  Series B bringing total funding to $57M. Sett operates a marketing and product website but publishes no
  public developer API, SDK, or documentation surface as of this profiling.'
